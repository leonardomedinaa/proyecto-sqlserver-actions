name: Generar Reporte CSV de Ventas e Inventario

on:
  schedule:
    # Se ejecuta todos los días a las 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:

env:
  ACCEPT_EULA: Y
  MSSQL_PID: Developer
  SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
  CONTAINER_NAME: sqlserver-report

jobs:
  generate-csv-report:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Levantar instancia SQL Server en Docker
        run: |
          docker run -e "ACCEPT_EULA=$ACCEPT_EULA" \
                     -e "MSSQL_PID=$MSSQL_PID" \
                     -e "MSSQL_SA_PASSWORD=$SA_PASSWORD" \
                     -p 1433:1433 \
                     --name $CONTAINER_NAME \
                     -d mcr.microsoft.com/mssql/server:2022-latest

      - name: 3. Esperar disponibilidad de SQL Server
        run: |
          for i in {1..30}; do
            if docker exec $CONTAINER_NAME /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" &> /dev/null; then
              break
            fi
            sleep 2
          done

      - name: 4. Inicializar esquema y datos
        run: |
          docker cp ./sql $CONTAINER_NAME:/tmp/sql
          SQLCMD="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $SA_PASSWORD -C -b"
          docker exec $CONTAINER_NAME $SQLCMD -i /tmp/sql/create_database.sql
          docker exec $CONTAINER_NAME $SQLCMD -i /tmp/sql/create_tables.sql
          docker exec $CONTAINER_NAME $SQLCMD -i /tmp/sql/create_procedure.sql
          docker exec $CONTAINER_NAME $SQLCMD -i /tmp/sql/create_trigger.sql
          docker exec $CONTAINER_NAME $SQLCMD -i /tmp/sql/test_data.sql

      - name: 5. Exportar consultas a archivos CSV
        run: |
          mkdir -p reportes
          
          # -s "," define coma como separador | -W quita espacios en blanco sobrantes
          docker exec $CONTAINER_NAME /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$SA_PASSWORD" -C \
            -d EmpresaDB \
            -Q "SET NOCOUNT ON; SELECT v.VentaID, v.Producto, v.Cantidad, v.Fecha, i.Stock AS StockRestante, a.Mensaje AS EstadoAuditoria FROM Ventas v INNER JOIN Inventario i ON v.Producto = i.Producto INNER JOIN AuditoriaVentas a ON v.VentaID = a.VentaID;" \
            -s "," -W | grep -v "^-" > reportes/reporte_ventas_inventario.csv

          echo "Contenido del CSV generado:"
          cat reportes/reporte_ventas_inventario.csv

      - name: 6. Publicar CSV como Artifact en GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: reporte-ventas-csv
          path: reportes/reporte_ventas_inventario.csv
          retention-days: 14
