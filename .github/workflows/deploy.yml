name: Despliegue SQL Server CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  ACCEPT_EULA: Y
  MSSQL_PID: Developer
  SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
  CONTAINER_NAME: sqlserver-ci

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del repositorio
        uses: actions/checkout@v4

      - name: 2. Iniciar contenedor de Microsoft SQL Server en Docker
        run: |
          docker run -e "ACCEPT_EULA=$ACCEPT_EULA" \
                     -e "MSSQL_PID=$MSSQL_PID" \
                     -e "MSSQL_SA_PASSWORD=$SA_PASSWORD" \
                     -p 1433:1433 \
                     --name $CONTAINER_NAME \
                     -d mcr.microsoft.com/mssql/server:2022-latest

      - name: 3. Esperar a que SQL Server esté listo para conexiones
        run: |
          echo "Esperando a que el motor de SQL Server inicie..."
          for i in {1..30}; do
            if docker exec $CONTAINER_NAME /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" &> /dev/null; then
              echo "¡SQL Server está en línea!"
              break
            fi
            echo "Intento $i: Aún iniciando, esperando 2 segundos..."
            sleep 2
          done

      - name: 4. Copiar scripts SQL al contenedor
        run: |
          docker cp ./sql $CONTAINER_NAME:/tmp/sql

      - name: 5. Ejecutar scripts de base de datos, tablas, SP, trigger y pruebas
        run: |
          SQLCMD="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $SA_PASSWORD -C -b"
          
          echo "Creando base de datos..."
          docker exec $CONTAINER_NAME $SQLCMD -i /tmp/sql/create_database.sql
          
          echo "Creando tablas..."
          docker exec $CONTAINER_NAME $SQLCMD -i /tmp/sql/create_tables.sql
          
          echo "Creando procedimiento almacenado..."
          docker exec $CONTAINER_NAME $SQLCMD -i /tmp/sql/create_procedure.sql
          
          echo "Creando trigger..."
          docker exec $CONTAINER_NAME $SQLCMD -i /tmp/sql/create_trigger.sql
          
          echo "Insertando datos de prueba y validando..."
          docker exec $CONTAINER_NAME $SQLCMD -i /tmp/sql/test_data.sql
